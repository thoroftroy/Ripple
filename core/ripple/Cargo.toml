[package]
name = "ripple"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["full"] }
ureq = "3.5.2"

[target.'cfg(target_os = "linux")'.dependencies]
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
libc = "0.2.191"
nix = { version = "0.32.0", features = ["term", "process", "signal", "fs", "ioctl", "user"] }
qrcode = "0.14.1"
vt100 = "0.18.1"
