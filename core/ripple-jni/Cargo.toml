[package]
name = "ripple-jni"
version = "0.1.1"
edition = "2024"

[lib]
name = "ripple_jni"
crate-type = ["cdylib"]

[dependencies]
ripple = { path = "../ripple" }
jni = "0.21.1"
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
